<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d1029" />
    <meta name="description" content="FREE-WARS: hold the lane with your cat swarm against a marching rat army." />
    <title>FREE-WARS</title>
    <link rel="icon" href="./favicon.ico" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0d1029;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        position: fixed;
        inset: 0;
        touch-action: none;
      }
      #game canvas {
        display: block;
      }

      /* Credit line along the bottom of every screen. Only its link takes presses. */
      .credit {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 6;
        padding: 3px 8px calc(3px + env(safe-area-inset-bottom));
        text-align: center;
        font: 700 clamp(9px, 2.5vw, 12px) / 1.35 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
        color: #c9cff0;
        background: rgba(11, 10, 31, 0.78);
        pointer-events: none;
      }
      .credit a {
        color: #ffd166;
        text-decoration: none;
        white-space: nowrap;
        pointer-events: auto;
      }
      .credit a:hover {
        text-decoration: underline;
      }
      .credit svg {
        width: 1.1em;
        height: 1.1em;
        vertical-align: -0.15em;
        fill: #ffd166;
      }

      /* HUD: plain HTML over the canvas. It never takes pointer events. */
      .hud {
        --hud-scale: 1;
        --ink: #1b1736;
        position: absolute;
        inset: 0;
        pointer-events: none;
        color: #fff;
        font-family: 'Arial Rounded MT Bold', 'Baloo 2', 'Fredoka', 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
        font-weight: 900;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
      }
      .hud-status {
        display: none;
        gap: 8px;
        justify-content: center;
        align-items: center;
        margin: 10px 10px 0;
      }
      .hud-pill,
      .hud-bar {
        height: 26px;
        border-radius: 13px;
        background: rgba(27, 23, 54, 0.82);
        border: 3px solid var(--ink);
        font-size: 14px;
        line-height: 26px;
        text-shadow:
          0 2px 0 var(--ink),
          0 0 3px var(--ink);
        white-space: nowrap;
      }
      .hud-pill {
        padding: 0 12px;
        background: #2f8bff;
      }
      .hud-bar {
        position: relative;
        flex: 0 1 190px;
        overflow: hidden;
      }
      .hud-fill {
        position: absolute;
        inset: 0 auto 0 0;
        width: 0;
        border-radius: 10px;
      }
      .hud-fill-base {
        background: linear-gradient(#9af0a2, #4fcf66);
      }
      .hud-fill-wave {
        background: linear-gradient(#7fdcff, #33b4ea);
      }
      .hud-bar-label {
        position: absolute;
        inset: 0;
        text-align: center;
      }
      .hud-weapons {
        display: flex;
        gap: 6px;
        justify-content: center;
        margin: 6px 10px 0;
      }
      .hud-weapon {
        display: none;
        position: relative;
        height: 22px;
        min-width: 96px;
        border-radius: 11px;
        background: rgba(27, 23, 54, 0.82);
        border: 3px solid var(--ink);
        overflow: hidden;
        font-size: 12px;
        line-height: 22px;
        text-shadow:
          0 2px 0 var(--ink),
          0 0 3px var(--ink);
        white-space: nowrap;
      }
      .hud-weapon-fill {
        position: absolute;
        inset: 0 auto 0 0;
        width: 0;
      }
      .hud-weapon-label {
        position: relative;
        padding: 0 10px;
        text-align: center;
      }
      /* HP bars float over big rats; the renderer places them every frame. */
      .hud-hp {
        display: none;
        position: absolute;
        left: 0;
        top: 0;
        border-radius: 9px;
        background: rgba(27, 23, 54, 0.85);
        border: 2px solid var(--ink);
        overflow: hidden;
        will-change: transform;
      }
      .hud-hp-fill {
        position: absolute;
        inset: 0 auto 0 0;
        width: 100%;
        background: #5fd66a;
      }
      .hud-hp-label {
        position: absolute;
        inset: 0;
        text-align: center;
        font-size: 12px;
        line-height: 16px;
        text-shadow:
          0 1px 0 var(--ink),
          0 0 3px var(--ink);
      }
      .hud-level {
        position: absolute;
        top: 22%;
        left: 0;
        right: 0;
        text-align: center;
        font-size: calc(30px * var(--hud-scale));
        opacity: 0;
        transition: opacity 0.6s;
        -webkit-text-stroke: 2px var(--ink);
        paint-order: stroke fill;
        text-shadow: 0 3px 0 var(--ink);
      }
      .hud-banner {
        position: absolute;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: calc(14px * var(--hud-scale));
        padding-bottom: 12%;
        background: rgba(11, 10, 31, 0.5);
        text-align: center;
      }
      .hud-title {
        font-size: calc(78px * var(--hud-scale));
        letter-spacing: 2px;
        color: #ffd166;
        -webkit-text-stroke: calc(7px * var(--hud-scale)) var(--ink);
        paint-order: stroke fill;
        text-shadow: 0 calc(7px * var(--hud-scale)) 0 rgba(11, 10, 31, 0.6);
      }
      .hud-title:empty {
        display: none;
      }
      .hud-subtitle {
        font-size: calc(28px * var(--hud-scale));
        white-space: pre-line;
        -webkit-text-stroke: calc(5px * var(--hud-scale)) var(--ink);
        paint-order: stroke fill;
        animation: hud-pulse 1.4s ease-in-out infinite;
      }
      .hud-pop {
        position: absolute;
        transform: translate(-50%, -50%);
        font-size: calc(46px * var(--hud-scale));
        -webkit-text-stroke: calc(7px * var(--hud-scale)) var(--ink);
        paint-order: stroke fill;
        text-shadow: 0 4px 0 rgba(11, 10, 31, 0.6);
        opacity: 0;
        white-space: nowrap;
      }
      .hud-pop-run {
        animation: hud-pop 1s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
      }
      /* Screens: the splash menu, the map grid and the panels with buttons. */
      .ui {
        position: absolute;
        inset: 0;
        pointer-events: none;
        color: #fff;
        font-family: 'Arial Rounded MT Bold', 'Baloo 2', 'Fredoka', 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
        font-weight: 900;
        --ink: #1b1736;
      }
      .ui-panel {
        position: absolute;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 16px 16px 44px;
        box-sizing: border-box;
        background: rgba(11, 10, 31, 0.72);
        text-align: center;
        pointer-events: auto;
        overflow-y: auto;
      }
      .ui-panel.ui-show {
        display: flex;
        animation: ui-in 0.25s ease-out;
      }
      .ui-logo {
        font-size: clamp(44px, 15vw, 96px);
        line-height: 1;
        letter-spacing: 2px;
        color: #ffd166;
        -webkit-text-stroke: 8px var(--ink);
        paint-order: stroke fill;
        text-shadow: 0 8px 0 rgba(11, 10, 31, 0.6);
      }
      .ui-title {
        font-size: clamp(34px, 11vw, 64px);
        color: #ffd166;
        -webkit-text-stroke: 7px var(--ink);
        paint-order: stroke fill;
        text-shadow: 0 6px 0 rgba(11, 10, 31, 0.6);
      }
      .ui-red {
        color: #ff6b6b;
      }
      .ui-tag,
      .ui-text,
      .ui-notice {
        font-size: clamp(13px, 3.6vw, 18px);
        -webkit-text-stroke: 4px var(--ink);
        paint-order: stroke fill;
      }
      .ui-big {
        font-size: clamp(20px, 6vw, 34px);
      }
      .ui-notice {
        min-height: 1.3em;
        color: #9be7ff;
      }
      .ui-link {
        color: #7fdcff;
      }
      .ui-button {
        font: inherit;
        color: #fff;
        font-size: clamp(16px, 4.6vw, 22px);
        padding: 10px 22px;
        min-width: 190px;
        border-radius: 16px;
        border: 4px solid var(--ink);
        background: linear-gradient(#4aa3ff, #2f7be6);
        box-shadow: 0 5px 0 var(--ink);
        text-shadow: 0 2px 0 var(--ink);
        cursor: pointer;
        touch-action: manipulation;
      }
      .ui-button:active {
        transform: translateY(4px);
        box-shadow: 0 1px 0 var(--ink);
      }
      .ui-primary {
        font-size: clamp(24px, 7.5vw, 38px);
        padding: 12px 40px;
        background: linear-gradient(#ffd95e, #f5a623);
      }
      .ui-small {
        min-width: 0;
        font-size: clamp(12px, 3.4vw, 16px);
        padding: 8px 14px;
        background: linear-gradient(#6b74b8, #4b5396);
      }
      .ui-danger {
        background: linear-gradient(#e86a6a, #c23b3b);
      }
      .ui-row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .ui-sliders {
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: min(86vw, 340px);
        padding: 12px 14px;
        border-radius: 16px;
        border: 3px solid var(--ink);
        background: rgba(27, 23, 54, 0.85);
      }
      .ui-slider {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 14px;
      }
      .ui-slider-name {
        width: 64px;
        text-align: left;
      }
      .ui-range {
        flex: 1;
        height: 26px;
        accent-color: #ffd166;
        touch-action: pan-x;
      }
      /* Pop-up card for the rules and the about text. */
      .ui-popup {
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 16px 16px 44px;
        box-sizing: border-box;
        background: rgba(11, 10, 31, 0.8);
        pointer-events: auto;
      }
      .ui-popup.ui-show {
        display: flex;
        animation: ui-in 0.2s ease-out;
      }
      .ui-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        width: min(92vw, 460px);
        max-height: 100%;
        padding: 16px;
        box-sizing: border-box;
        border-radius: 18px;
        border: 4px solid var(--ink);
        background: #2a2757;
        box-shadow: 0 6px 0 var(--ink);
      }
      .ui-card-title {
        font-size: clamp(26px, 8vw, 40px);
      }
      .ui-card-body {
        overflow-y: auto;
        text-align: left;
        font-family: 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
        font-weight: 700;
        font-size: clamp(13px, 3.6vw, 16px);
        line-height: 1.35;
      }
      .ui-card-line {
        margin: 0 0 8px;
      }
      /* The 44 maps: eleven to a row, the last of each row a boss map. */
      .ui-grid {
        display: grid;
        gap: clamp(3px, 0.9vw, 8px);
        width: min(96vw, 700px);
      }
      .ui-level {
        font: inherit;
        aspect-ratio: 1;
        padding: 0;
        min-width: 0;
        color: #fff;
        font-size: clamp(11px, 3.5vw, 26px);
        border-radius: 22%;
        border: clamp(2px, 0.5vw, 4px) solid var(--ink);
        background: linear-gradient(#58b0ff, #2f7be6);
        box-shadow: 0 clamp(2px, 0.6vw, 5px) 0 var(--ink);
        -webkit-text-stroke: clamp(2px, 0.6vw, 4px) var(--ink);
        paint-order: stroke fill;
        cursor: pointer;
        touch-action: manipulation;
      }
      .ui-level.ui-open {
        animation: ui-beat 1s ease-in-out infinite;
      }
      .ui-level.ui-done {
        background: linear-gradient(#7ee08a, #3fb556);
      }
      .ui-level.ui-boss {
        background: linear-gradient(#ff7b7b, #d12f2f);
      }
      .ui-level.ui-locked {
        background: linear-gradient(#6a6f8c, #474b66);
        color: transparent;
        -webkit-text-stroke: 0;
        cursor: default;
        position: relative;
      }
      .ui-level.ui-boss.ui-locked {
        background: linear-gradient(#a85a5a, #7a3232);
      }
      /* A padlock drawn with two boxes: the body and the shackle. */
      .ui-level.ui-locked::before,
      .ui-level.ui-locked::after {
        content: '';
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
      }
      .ui-level.ui-locked::before {
        top: 46%;
        width: 46%;
        height: 32%;
        border-radius: 15%;
        background: #e9ecff;
      }
      .ui-level.ui-locked::after {
        top: 20%;
        width: 24%;
        height: 26%;
        border: clamp(2px, 0.55vw, 4px) solid #e9ecff;
        border-bottom: 0;
        border-radius: 50% 50% 0 0;
      }
      /* Map editor: a bar of buttons, a palette, and a grid that scrolls for ever. */
      .ed {
        position: absolute;
        inset: 0;
        /* Above the menus and the HUD. */
        z-index: 5;
        display: none;
        flex-direction: column;
        gap: 6px;
        padding: 8px 8px 40px;
        box-sizing: border-box;
        background: #0f0d26;
        color: #fff;
        font-family: 'Arial Rounded MT Bold', 'Baloo 2', 'Fredoka', 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
        font-weight: 900;
        pointer-events: auto;
        -webkit-user-select: none;
        user-select: none;
      }
      .ed.ed-show {
        display: flex;
      }
      .ed-bar,
      .ed-palette {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }
      .ed-button,
      .ed-select,
      .ed-name {
        font: inherit;
        font-size: 12px;
        height: 30px;
        padding: 0 10px;
        color: #fff;
        border-radius: 9px;
        border: 2px solid #1b1736;
        background: #4b5396;
        box-sizing: border-box;
      }
      .ed-button {
        cursor: pointer;
        touch-action: manipulation;
      }
      .ed-button.ed-strong {
        background: #f5a623;
      }
      .ed-name {
        flex: 1 1 110px;
        min-width: 90px;
        background: #26234d;
        -webkit-user-select: text;
        user-select: text;
      }
      .ed-file {
        display: none;
      }
      .ed-message {
        min-height: 16px;
        font-size: 12px;
        color: #9be7ff;
      }
      .ed-tool {
        width: 40px;
        height: 40px;
        padding: 2px;
        border-radius: 9px;
        border: 2px solid #1b1736;
        background: #26234d;
        cursor: pointer;
        touch-action: none;
      }
      .ed-tool.ed-wide {
        width: 72px;
      }
      .ed-tool canvas {
        width: 100%;
        height: 100%;
        display: block;
        pointer-events: none;
      }
      .ed-tool.ed-on {
        border-color: #ffd166;
        background: #5a4d1c;
        box-shadow: 0 0 0 2px #ffd166;
      }
      .ed-scroll {
        position: relative;
        flex: 1;
        min-height: 0;
        overflow-y: scroll;
        overflow-x: hidden;
        border-radius: 8px;
        background: #1a1838;
      }
      .ed-canvas {
        position: sticky;
        top: 0;
        left: 0;
        display: block;
        touch-action: none;
        cursor: crosshair;
      }
      @keyframes ui-in {
        from {
          opacity: 0;
        }
      }
      @keyframes ui-beat {
        50% {
          transform: scale(1.08);
        }
      }
      @keyframes hud-pop {
        0% {
          opacity: 0;
          transform: translate(-50%, -30%) scale(0.3);
        }
        18% {
          opacity: 1;
          transform: translate(-50%, -90%) scale(1.25);
        }
        35% {
          transform: translate(-50%, -110%) scale(1);
        }
        75% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translate(-50%, -230%) scale(1);
        }
      }
      @keyframes hud-pulse {
        50% {
          opacity: 0.55;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <!-- Shown on every screen: menu, play and map editor. -->
    <footer class="credit">
      FREE WARS &middot; AGPLv3 license &middot; Make your own game &middot;
      <a href="https://github.com/PacifAIst/free-wars" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2.2l3 6.3 6.9.9-5 4.8 1.3 6.8L12 17.7 5.8 21l1.3-6.8-5-4.8 6.9-.9z" />
        </svg>
        Star us on GitHub: github.com/PacifAIst/free-wars
      </a>
    </footer>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
